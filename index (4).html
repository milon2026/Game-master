<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tic Tac Toe Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-gap: 5px;
            justify-content: center;
        }
        .cell {
            width: 100px;
            height: 100px;
            font-size: 2em;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f0f0;
            border: 2px solid #333;
            cursor: pointer;
        }
        #status {
            margin-top: 20px;
            font-size: 1.2em;
        }
    </style>

    <!-- Monetag script -->
    <script src='//whephiwums.com/sdk.js' data-zone='9286229' data-sdk='show_9286229'></script>
</head>
<body>

    <h1>Tic Tac Toe</h1>
    <div class="board" id="board"></div>
    <div id="status">Player X's turn</div>

    <script>
        const board = document.getElementById('board');
        const status = document.getElementById('status');
        let currentPlayer = 'X';
        let cells = Array(9).fill(null);

        function checkWinner() {
            const winningCombinations = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8],
                [0, 3, 6], [1, 4, 7], [2, 5, 8],
                [0, 4, 8], [2, 4, 6]
            ];

            for (const combo of winningCombinations) {
                const [a, b, c] = combo;
                if (cells[a] && cells[a] === cells[b] && cells[a] === cells[c]) {
                    return cells[a];
                }
            }
            return cells.includes(null) ? null : 'Draw';
        }

        function handleClick(index) {
            if (!cells[index]) {
                cells[index] = currentPlayer;
                render();
                const winner = checkWinner();
                if (winner) {
                    status.textContent = winner === 'Draw' ? 'It\'s a draw!' : `Player ${winner} wins!`;
                    board.removeEventListener('click', boardClick);
                } else {
                    currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                    status.textContent = `Player ${currentPlayer}'s turn`;
                }
            }
        }

        function boardClick(e) {
            const index = parseInt(e.target.dataset.index);
            if (!isNaN(index)) handleClick(index);
        }

        function render() {
            board.innerHTML = '';
            cells.forEach((cell, index) => {
                const div = document.createElement('div');
                div.className = 'cell';
                div.dataset.index = index;
                div.textContent = cell || '';
                board.appendChild(div);
            });
        }

        board.addEventListener('click', boardClick);
        render();
    </script>

</body>
</html>
